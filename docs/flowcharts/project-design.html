<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Causal Volatility Framework - Project Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 2rem;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
        }
        .diagram-container {
            background-color: #f5f5f5;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid rgba(45,49,66,0.1);
            max-width: 800px;
            width: 100%;
        }
        .header {
            margin-bottom: 2rem;
        }
        .eyebrow {
            font-family: 'Geist Mono', monospace;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #4f5d75;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-family: 'Instrument Serif', serif;
            font-size: 2.5rem;
            font-weight: 400;
            color: #2d3142;
            margin: 0 0 0.5rem 0;
        }
        .subtitle {
            font-family: 'Geist', sans-serif;
            font-size: 14px;
            color: #4f5d75;
            margin: 0;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="diagram-container">
        <div class="header">
            <div class="eyebrow">Architecture Flowchart</div>
            <h1>Causal Volatility Framework</h1>
            <p class="subtitle">End-to-end pipeline from market data ingestion to adaptive risk backtesting.</p>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="cv-title cv-desc">
            <title id="cv-title">Causal Volatility System Architecture</title>
            <desc id="cv-desc">Flowchart showing the data pipeline from ingestion to risk evaluation, highlighting the novel causal discovery and adaptive multiplier stages.</desc>
            
            <defs>
                <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
                </marker>
                <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
                </marker>
            </defs>

            <!-- Background -->
            <rect width="100%" height="100%" fill="#f5f5f5"/>

            <!-- Connectors -->
            <path d="M 200 80 L 280 80" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
            <path d="M 440 80 L 520 80" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
            <path d="M 600 120 L 600 200" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
            <path d="M 520 240 L 440 240" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
            <path d="M 280 240 L 200 240" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
            <path d="M 120 280 L 120 360" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
            <path d="M 200 400 L 280 400" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

            <!-- Arrow Labels -->
            <!-- 1 -> 2 -->
            <rect x="208" y="60" width="64" height="12" rx="2" fill="#f5f5f5"/>
            <text x="240" y="68" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MARKET DATA</text>
            
            <!-- 2 -> 3 -->
            <rect x="448" y="60" width="64" height="12" rx="2" fill="#f5f5f5"/>
            <text x="480" y="68" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VOLATILITY</text>
            
            <!-- 3 -> 4 (Vertical) -->
            <rect x="608" y="152" width="48" height="12" rx="2" fill="#f5f5f5"/>
            <text x="632" y="160" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETURNS</text>
            
            <!-- 4 -> 5 -->
            <rect x="448" y="220" width="64" height="12" rx="2" fill="#f5f5f5"/>
            <text x="480" y="228" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INNOVATIONS</text>
            
            <!-- 5 -> 6 (Focal) -->
            <rect x="204" y="220" width="72" height="12" rx="2" fill="#f5f5f5"/>
            <text x="240" y="228" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CAUSAL GRAPH</text>
            
            <!-- 6 -> 7 (Vertical) -->
            <rect x="128" y="312" width="40" height="12" rx="2" fill="#f5f5f5"/>
            <text x="148" y="320" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LAMBDA</text>
            
            <!-- 7 -> 8 -->
            <rect x="208" y="380" width="64" height="12" rx="2" fill="#f5f5f5"/>
            <text x="240" y="388" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PNL METRICS</text>

            <!-- Nodes -->
            <!-- Node 1: Ingest -->
            <g id="node-1">
                <rect x="40" y="40" width="160" height="80" rx="6" fill="#f5f5f5"/>
                <rect x="40" y="40" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
                <rect x="48" y="44" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
                <text x="72" y="52" fill="rgba(45,49,66,0.8)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">INGEST</text>
                <text x="120" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Data Ingestion</text>
                <text x="120" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YF / FRED APIs</text>
            </g>

            <!-- Node 2: Realized Volatility -->
            <g id="node-2">
                <rect x="280" y="40" width="160" height="80" rx="6" fill="#f5f5f5"/>
                <rect x="280" y="40" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
                <rect x="288" y="44" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
                <text x="316" y="52" fill="rgba(45,49,66,0.8)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">COMPUTE</text>
                <text x="360" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Realized Volatility</text>
                <text x="360" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Garman-Klass, YZ</text>
            </g>

            <!-- Node 3: Diagnostics -->
            <g id="node-3">
                <rect x="520" y="40" width="160" height="80" rx="6" fill="#f5f5f5"/>
                <rect x="520" y="40" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
                <rect x="528" y="44" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
                <text x="560" y="52" fill="rgba(45,49,66,0.8)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALIDATE</text>
                <text x="600" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stationarity Diag.</text>
                <text x="600" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ADF / KPSS Tests</text>
            </g>

            <!-- Node 4: Vol Models -->
            <g id="node-4">
                <rect x="520" y="200" width="160" height="80" rx="6" fill="#f5f5f5"/>
                <rect x="520" y="200" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
                <rect x="528" y="204" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
                <text x="548" y="212" fill="rgba(45,49,66,0.8)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
                <text x="600" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Vol Residualization</text>
                <text x="600" y="260" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AR-GARCH Engines</text>
            </g>

            <!-- Node 5: Causal Discovery (FOCAL) -->
            <g id="node-5">
                <rect x="280" y="200" width="160" height="80" rx="6" fill="#f5f5f5"/>
                <rect x="280" y="200" width="160" height="80" rx="6" fill="#fcece6" stroke="#eb6c36" stroke-width="1"/>
                <rect x="288" y="204" width="64" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.4)" stroke-width="0.8"/>
                <text x="320" y="212" fill="rgba(235,108,54,0.9)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISCOVERY</text>
                <text x="360" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Causal Discovery</text>
                <text x="360" y="260" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Rank-Deficiency Fix</text>
            </g>

            <!-- Node 6: Adaptive Multiplier (FOCAL) -->
            <g id="node-6">
                <rect x="40" y="200" width="160" height="80" rx="6" fill="#f5f5f5"/>
                <rect x="40" y="200" width="160" height="80" rx="6" fill="#fcece6" stroke="#eb6c36" stroke-width="1"/>
                <rect x="48" y="204" width="72" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.4)" stroke-width="0.8"/>
                <text x="84" y="212" fill="rgba(235,108,54,0.9)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MULTIPLIER</text>
                <text x="120" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Adaptive Risk</text>
                <text x="120" y="260" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Z-Score EWM</text>
            </g>

            <!-- Node 7: Backtest Engine -->
            <g id="node-7">
                <rect x="40" y="360" width="160" height="80" rx="6" fill="#f5f5f5"/>
                <rect x="40" y="360" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
                <rect x="48" y="364" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
                <text x="72" y="372" fill="rgba(45,49,66,0.8)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENGINE</text>
                <text x="120" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Backtest Engine</text>
                <text x="120" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Trailing Stop Ratchet</text>
            </g>

            <!-- Node 8: Risk Evaluator -->
            <g id="node-8">
                <rect x="280" y="360" width="160" height="80" rx="6" fill="#f5f5f5"/>
                <rect x="280" y="360" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
                <rect x="288" y="364" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
                <text x="316" y="372" fill="rgba(45,49,66,0.8)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">METRICS</text>
                <text x="360" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Risk Evaluator</text>
                <text x="360" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Sharpe, Drawdowns</text>
            </g>

            <!-- Legend -->
            <line x1="40" y1="484" x2="680" y2="484" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
            <text x="40" y="500" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

            <rect x="120" y="492" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
            <text x="140" y="500" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Standard Pipeline Stage</text>

            <rect x="300" y="492" width="12" height="12" rx="2" fill="#fcece6" stroke="#eb6c36" stroke-width="1"/>
            <text x="320" y="500" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Novel Causal Engine</text>

        </svg>
    </div>
</body>
</html>
