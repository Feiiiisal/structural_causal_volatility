<html lang="en">
<head>

  <style>
    :root {
      /* Editorial Palette (Light Mode Default) */
      --bg: #f8f9fa;
      --bg-dots: #d8dee4;
      --surface: #ffffff;
      --surface-subtle: #f3f4f6;
      --surface-card: #ffffff;
      --ink: #1e2530;
      --ink-muted: #57606a;
      --ink-faint: #8c959f;
      --border: #d0d7de;
      --border-focus: #0969da;
      --border-subtle: #e1e4e8;
      
      /* Accents */
      --coral: #eb6c36;
      --coral-subtle: #fff4ee;
      --coral-border: #f8c2ab;
      --blue: #0969da;
      --blue-subtle: #ddf4ff;
      --purple: #8250df;
      --purple-subtle: #fbefff;
      --green: #1a7f37;
      --green-subtle: #dafbe1;
      --amber: #9a6700;
      --amber-subtle: #fff8c5;
      
      /* Shadow & Radius */
      --shadow-sm: 0 1px 3px rgba(27, 31, 36, 0.08);
      --shadow-md: 0 4px 12px rgba(27, 31, 36, 0.08);
      --shadow-lg: 0 8px 24px rgba(27, 31, 36, 0.12);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-pill: 9999px;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --bg-dots: #21262d;
      --surface: #161b22;
      --surface-subtle: #21262d;
      --surface-card: #161b22;
      --ink: #f0f6fc;
      --ink-muted: #8b949e;
      --ink-faint: #484f58;
      --border: #30363d;
      --border-focus: #58a6ff;
      --border-subtle: #21262d;

      --coral: #f0883e;
      --coral-subtle: #381a0b;
      --coral-border: #6e361a;
      --blue: #58a6ff;
      --blue-subtle: #0d2847;
      --purple: #bc8cff;
      --purple-subtle: #291a45;
      --green: #3fb950;
      --green-subtle: #0f2d18;
      --amber: #d29922;
      --amber-subtle: #3b2c04;

      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.5);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.6);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Navigation Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
    }

    .brand-section {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-badge {
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: var(--coral-subtle);
      color: var(--coral);
      border: 1px solid var(--coral-border);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      font-size: 11.5px;
      color: var(--ink-muted);
      font-weight: 400;
    }

    /* Scope Pills Banner */
    .scope-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
    }

    .scope-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Geist Mono', monospace;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--ink);
    }

    .scope-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Header Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-family: 'Geist', sans-serif;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--surface-subtle);
      border-color: var(--ink-muted);
    }

    .btn-primary {
      background: var(--blue);
      color: #ffffff;
      border-color: var(--blue);
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-accent {
      background: var(--coral);
      color: #ffffff;
      border-color: var(--coral);
    }

    .btn-accent:hover {
      opacity: 0.9;
    }

    .divider-v {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
    }

    /* Main Viewport for Pan and Zoom */
    #viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: var(--bg);
      background-image: radial-gradient(var(--bg-dots) 1px, transparent 1px);
      background-size: 24px 24px;
      cursor: grab;
    }

    #viewport:active {
      cursor: grabbing;
    }

    #world {
      position: absolute;
      top: 0;
      left: 0;
      width: 2240px;
      height: 1140px;
      transform-origin: 0 0;
    }

    /* Animated Flow (Marching Ants) */
    .flow-animation {
      stroke-dasharray: 6;
      animation: flow 1.2s linear infinite;
    }

    @keyframes flow {
      to {
        stroke-dashoffset: -12;
      }
    }

    /* Interactive Tooltip */
    #tooltip {
      position: fixed;
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-size: 12px;
      color: var(--ink);
      max-width: 320px;
      z-index: 1000;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
  </style>
</head>

  <!-- Interactive Client Controller Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const viewport = document.getElementById('viewport');
      const world = document.getElementById('world');
      const svg = document.getElementById('blueprint-svg');
      const tooltip = document.getElementById('tooltip');

      // State
      let scale = 1;
      let panX = 0;
      let panY = 0;
      let isDragging = false;
      let startX = 0;
      let startY = 0;
      let isFlowActive = false;

      // Transform update
      function updateTransform() {
        world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      }

      // Auto Fit View
      function fitView() {
        const vpW = viewport.clientWidth;
        const vpH = viewport.clientHeight;
        const worldW = 2240;
        const worldH = 1140;

        const scaleX = (vpW - 40) / worldW;
        const scaleY = (vpH - 40) / worldH;
        scale = Math.min(scaleX, scaleY, 1.0);

        panX = Math.max(20, (vpW - worldW * scale) / 2);
        panY = Math.max(20, (vpH - worldH * scale) / 2);
        updateTransform();
      }

      // Initial Fit
      window.addEventListener('resize', fitView);
      setTimeout(fitView, 100);

      // Mouse Pan
      viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('button')) return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });

      // Wheel Zoom
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = 1.1;
        const mouseX = e.clientX;
        const mouseY = e.clientY;

        const worldMouseX = (mouseX - panX) / scale;
        const worldMouseY = (mouseY - panY) / scale;

        if (e.deltaY < 0) {
          scale = Math.min(2.5, scale * zoomFactor);
        } else {
          scale = Math.max(0.3, scale / zoomFactor);
        }

        panX = mouseX - worldMouseX * scale;
        panY = mouseY - worldMouseY * scale;
        updateTransform();
      }, { passive: false });

      // Button Controls
      document.getElementById('btn-zoom-in').addEventListener('click', () => {
        scale = Math.min(2.5, scale * 1.2);
        updateTransform();
      });

      document.getElementById('btn-zoom-out').addEventListener('click', () => {
        scale = Math.max(0.3, scale / 1.2);
        updateTransform();
      });

      document.getElementById('btn-fit-view').addEventListener('click', fitView);

      // Marching Ants Motion Toggle
      document.getElementById('btn-toggle-motion').addEventListener('click', () => {
        isFlowActive = !isFlowActive;
        const paths = svg.querySelectorAll('path[class^="connector"]');
        paths.forEach(p => {
          if (isFlowActive) {
            p.classList.add('flow-animation');
          } else {
            p.classList.remove('flow-animation');
          }
        });
        const btn = document.getElementById('btn-toggle-motion');
        btn.classList.toggle('btn-accent', isFlowActive);
      });

      // Dark / Light Mode Toggle
      document.getElementById('btn-toggle-theme').addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          document.getElementById('btn-toggle-theme').innerHTML = '<i class="fas fa-moon"></i>';
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.getElementById('btn-toggle-theme').innerHTML = '<i class="fas fa-sun"></i>';
        }
      });

      // Export SVG
      document.getElementById('btn-export-svg').addEventListener('click', () => {
        const svgData = new XMLSerializer().serializeToString(svg);
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const svgUrl = URL.createObjectURL(svgBlob);
        const downloadLink = document.createElement('a');
        downloadLink.href = svgUrl;
        downloadLink.download = 'causal_volatility_blueprint.svg';
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      });

      // Export PNG via Canvas
      document.getElementById('btn-export-png').addEventListener('click', () => {
        const svgData = new XMLSerializer().serializeToString(svg);
        const canvas = document.createElement('canvas');
        canvas.width = 2240;
        canvas.height = 1140;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = () => {
          ctx.fillStyle = '#f8f9fa';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          const pngUrl = canvas.toDataURL('image/png');
          const a = document.createElement('a');
          a.href = pngUrl;
          a.download = 'causal_volatility_blueprint.png';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };
        img.src = url;
      });
    });
  </script>
