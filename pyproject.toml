[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-causal-volatility"
version = "0.2.0"
description = "Causal volatility networks for portfolio risk management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Halkano Molu Guracha" },
    { name = "Feisel Hassan Ali" },
    { name = "Tushar Gahlot" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "networkx>=3.0",
    "torch>=2.0",
    "catboost>=1.2",
    "pandas-datareader>=0.10",
    "matplotlib>=3.7",
    "seaborn>=0.13"
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["catboost_dagma*"]

[tool.pytest.ini_options]
testpaths = ["catboost_dagma/tests"]
python_files = ["test_*.py"]
