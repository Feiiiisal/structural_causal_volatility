[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causal_volatility"
version = "0.1.0"
description = "Causal Graph Volatility Analysis & Framework Expansion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Quantitative Research Team" }
]
keywords = [
    "quantitative-finance",
    "volatility",
    "causal-inference",
    "garch",
    "granger-causality",
    "backtesting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "arch>=6.0.0",
    "yfinance>=0.2.28",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
causal-volatility = "causal_volatility.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["causal_volatility*"]

[tool.pytest.ini_options]
testpaths = ["tests", "catboost_dagma/tests"]
python_files = ["test_*.py"]

