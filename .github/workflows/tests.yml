name: Tests

on:
  push:
    branches: [main]
    paths:
      - "catboost_dagma/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: capstone-tests-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pandas scipy statsmodels scikit-learn networkx catboost pandas-datareader matplotlib seaborn pytest
          pip install -e . --no-deps

      - name: Test
        run: pytest -q catboost_dagma/tests
