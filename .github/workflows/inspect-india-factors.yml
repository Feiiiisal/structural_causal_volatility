name: Inspect India factor archive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-india-factors.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - name: Inspect daily factors
        run: |
          python - <<'PY'
          import io, zipfile, requests, pandas as pd

          url="https://faculty.iima.ac.in/iffm/Indian-Fama-French-Momentum/archive/2025-12.zip"
          r=requests.get(url, timeout=90, headers={"User-Agent":"Mozilla/5.0"})
          r.raise_for_status()
          z=zipfile.ZipFile(io.BytesIO(r.content))
          name="2025-12_FourFactors_and_Market_Returns_Daily_SurvivorshipBiasAdjusted.csv"
          df=pd.read_csv(z.open(name))
          df["Date"]=pd.to_datetime(df["Date"], errors="coerce")
          df=df[(df["Date"]>="2016-01-01") & (df["Date"]<"2026-01-01")]

          print("shape",df.shape)
          print("range",df["Date"].min(),df["Date"].max())
          print("columns",list(df.columns))
          print("NA counts")
          print(df.isna().sum())
          print("rows complete",len(df.dropna()))
          print("annual counts")
          print(df.assign(year=df["Date"].dt.year).groupby("year").agg(
              rows=("Date","size"),
              smb=("SMB","count"),
              hml=("HML","count"),
              mf=("MF","count"),
              rf=("RF","count"),
          ))
          print("sample missing")
          print(df[df[["SMB","HML","MF","RF"]].isna().any(axis=1)].head(30).to_string(index=False))
          PY
