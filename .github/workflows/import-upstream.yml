name: Import upstream project

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-upstream.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream project
        run: |
          git clone --depth 1 https://github.com/abuhaby/causal_graph_volatility.git /tmp/upstream
          rsync -a --delete --exclude '.git' --exclude '.github/workflows/import-upstream.yml' /tmp/upstream/ ./
          mkdir -p .github/workflows
          cp "$GITHUB_WORKSPACE/.github/workflows/import-upstream.yml" /tmp/import-upstream.yml 2>/dev/null || true
          if [ -f /tmp/import-upstream.yml ]; then cp /tmp/import-upstream.yml .github/workflows/import-upstream.yml; fi

      - name: Commit imported project
        run: |
          git config user.name "Feiiiisal"
          git config user.email "137709020+Feiiiisal@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import"
          else
            git commit -m "chore: import upstream causal volatility project"
            git push origin HEAD:main
          fi
