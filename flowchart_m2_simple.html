  <style>
    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --surface-subtle: #f8fafc;
      --ink: #0f172a;
      --ink-muted: #475569;
      --border: #cbd5e1;
      --border-subtle: #e2e8f0;
      --coral: #ea580c;
      --coral-subtle: #fff7ed;
      --slate-stroke: #334155;
    }

    [data-theme="dark"] {
      --bg: #0b0f19;
      --surface: #111827;
      --surface-subtle: #1f2937;
      --ink: #f8fafc;
      --ink-muted: #94a3b8;
      --border: #334155;
      --border-subtle: #1e293b;
      --coral: #f97316;
      --coral-subtle: #431407;
      --slate-stroke: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Top Action Bar */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
      flex-shrink: 0;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 20px;
      font-weight: 400;
      color: var(--ink);
    }

    .badge-m2 {
      font-family: 'Geist Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      background: var(--coral-subtle);
      color: var(--coral);
      padding: 2px 8px;
      border-radius: 9999px;
      border: 1px solid #fed7aa;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      font-family: 'Geist', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--surface-subtle);
      border-color: var(--ink-muted);
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    /* Viewport Area */
    #viewport {
      flex: 1;
      width: 100%;
      height: calc(100vh - 56px);
      position: relative;
      overflow: hidden;
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #viewport.dragging {
      cursor: grabbing;
    }

    #diagram-container {
      transform-origin: center center;
      will-change: transform;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.06));
    }

    svg {
      display: block;
      width: 940px;
      height: 710px;
    }

    /* Node Hover & Interactive Tooltips */
    .node-group {
      cursor: pointer;
      outline: none;
      transition: transform 0.15s ease;
    }

    .node-group:hover .card-rect {
      stroke-width: 2.2px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.08));
    }

    /* Tooltip Floating Card */
    #tooltip {
      position: absolute;
      display: none;
      background: #0f172a;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      max-width: 280px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
      pointer-events: none;
      z-index: 100;
      border: 1px solid #334155;
      line-height: 1.4;
    }

    #tooltip .tt-title {
      font-family: 'Geist', sans-serif;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    #tooltip .tt-desc {
      font-family: 'Geist', sans-serif;
      font-size: 11px;
      color: #cbd5e1;
    }
  </style>
</head>

    let startX, startY;

    const viewport = document.getElementById('viewport');
    const container = document.getElementById('diagram-container');
    const tooltip = document.getElementById('tooltip');
    const ttTitle = document.getElementById('tt-title');
    const ttDesc = document.getElementById('tt-desc');

    function updateTransform() {
      container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
      scale = Math.min(Math.max(0.4, scale * zoomFactor), 2.5);
      updateTransform();
    });

    viewport.addEventListener('mousedown', (e) => {
      if (e.target.closest('.header-actions') || e.target.closest('button')) return;
      isDragging = true;
      viewport.classList.add('dragging');
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
      viewport.classList.remove('dragging');
    });

    // Reset Zoom
    document.getElementById('btn-reset').addEventListener('click', () => {
      scale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    });

    // Dark Mode Toggle
    document.getElementById('btn-theme').addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
    });

    // Tooltip Interactions
    document.querySelectorAll('.node-group').forEach(node => {
      node.addEventListener('mouseenter', (e) => {
        const id = node.getAttribute('data-id');
        const info = NODE_INFO[id];
        if (info) {
          ttTitle.textContent = info.title;
          ttDesc.textContent = info.desc;
          tooltip.style.display = 'block';
        }
      });

      node.addEventListener('mousemove', (e) => {
        tooltip.style.left = (e.clientX + 16) + 'px';
        tooltip.style.top = (e.clientY + 16) + 'px';
      });

      node.addEventListener('mouseleave', () => {
        tooltip.style.display = 'none';
      });
    });

    // Export SVG
    document.getElementById('btn-export-svg').addEventListener('click', () => {
      const svgEl = document.getElementById('main-svg');
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svgEl);
      if (!source.match(/^<svg[^>]+xmlns="http:\/\/www\.w3\.org\/2000\/svg"/)) {
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'm2_causal_architecture_simple.svg';
      a.click();
      URL.revokeObjectURL(url);
    });

    // Export PNG
    document.getElementById('btn-export-png').addEventListener('click', () => {
      const svgEl = document.getElementById('main-svg');
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(svgEl);
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = 940 * 2;
        canvas.height = 710 * 2;
        const ctx = canvas.getContext('2d');
        ctx.scale(2, 2);
        ctx.fillStyle = '#f8f9fa';
        ctx.fillRect(0, 0, 940, 710);
        ctx.drawImage(img, 0, 0);
        const pngUrl = canvas.toDataURL('image/png');
        const a = document.createElement('a');
        a.href = pngUrl;
        a.download = 'm2_causal_architecture_simple.png';
        a.click();
        URL.revokeObjectURL(url);
      };
      img.src = url;
    });
  </script>
</body>
</html>
